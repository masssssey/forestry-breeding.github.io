function rank(d){
  const R=d.REC,cost={};
  Object.keys(d.SRC).forEach(n=>cost[n]=R[n]?1e9:0);
  const w=x=>cost[x[0]]+cost[x[1]]+(x[3]?.01:0);
  for(let i=0;i<80;i++){let c=false;for(const n in R)for(const x of R[n]){const v=1+w(x);if(v<cost[n]){cost[n]=v;c=true}}if(!c)break}
  for(const n in R)R[n].sort((x,y)=>w(x)-w(y)||(+y[2]||0)-(+x[2]||0));
}

  $('#list').innerHTML=items.length?items.map(n=>`<button class="chip ${REC[n]?'':'base'} ${n===cur?'sel':''}" data-sp="${n}" title="${nice(n)}">${tr(n)}${FL.has(n)?' ⚠':''}</button>`).join(''):'<span class="mu">Ничего не найдено. Измените запрос или фильтр.</span>';
}
function pick(n){const r=REC[n];return r[(ch[n]||0)%r.length]}
function pc(x){return x?` · ${x}%`:''}
function role(i){return mode==='t'?(i?['🌼','пыльца']:['🌱','саженец']):(i?['🐝','трутень']:['👑','принцесса'])}
function node(n,path,ri){
  const r=REC[n],o=own.has(n),exp=r&&!o&&!path.includes(n);
  let kids='',info='';
  if(exp){
    const [a,b,c,cd]=pick(n),i=(ch[n]||0)%r.length;
    kids=`<ul>${node(a,[...path,n],0)}${node(b,[...path,n],1)}</ul>`;
    info=(c?`<span class="sm">шанс ${c}%</span>`:'')+(cd?`<span class="sm" style="color:var(--wa)" title="Обязательное условие мутации">⚑ ${cd}</span>`:'')+(FL.has(n)?'<span class="sm" style="color:var(--wa)" title="Родители совпадают с другим видом. Сверьте рецепт в игре.">⚠ проверить</span>':'')+(r.length>1?`<button class="alt" data-alt="${n}" title="Другой рецепт">↻ ${i+1}/${r.length}</button>`:'');
  }else if(o)info='<span class="sm">✓ есть</span>';
  else if(path.includes(n))info='<span class="sm">цикл</span>';
  else info=`<span class="sm">${LBL[SRC[n]]}</span>`;
  const rl=ri<0?'':`<span class="rl">${role(ri)[0]} ${role(ri)[1]}</span>`;
  return `<li><div class="nd ${ri<0?'root':''} ${r?'':'lf'} ${o?'own':''}" ${ri<0?'':`data-own="${n}"`} title="${nice(n)}">${rl}<b>${tr(n)}</b>${info}</div>${kids}</li>`;
}
function plan(n){
  const steps=[],leaves=new Set(),seen=new Set(),roles={};
  const add=(x,i)=>{(roles[x]=roles[x]||new Set()).add(role(i)[0])};
  (function w(x,p){
    const r=REC[x];
    if(!r||own.has(x)){leaves.add(x);return}
    if(p.includes(x))return;
    const [a,b,c,cd]=pick(x);add(a,0);add(b,1);w(a,[...p,x]);w(b,[...p,x]);
    if(!seen.has(x)){seen.add(x);steps.push([x,a,b,c,cd])}
  })(n,[]);
  return{steps,leaves,roles};
}
function renderOut(){
  if(!cur){$('#out').innerHTML=`<p class="mu" style="margin:0">Выберите ${mode==='t'?'вид':'пчелу'} из списка выше, и здесь появится дерево скрещивания.</p>`;return}
  const {steps,leaves,roles}=plan(cur),lv=[...leaves].filter(x=>!own.has(x));
  const en=tr(cur)!==nice(cur)?` <span class="mu" style="font:14px system-ui">${nice(cur)}</span>`:'';
  const lg=mode==='t'?'🌱 саженец: это дерево сажают и опыляют. 🌼 пыльца: берётся с листвы другого вида. Роли в паре можно поменять местами, мутация сработает так же.':'👑 принцесса и 🐝 трутень: роли в паре можно поменять местами.';
  $('#out').innerHTML=`<h2>${tr(cur)}${en}${FL.has(cur)?'<span class="warn" title="Рецепт под сомнением">⚠</span>':''}</h2>`+
  (steps.length?`<h3>Нужно найти или вырастить (${lv.length})</h3><div>${lv.map(x=>`<span class="leaf">${tr(x)} ${[...(roles[x]||[])].join('')}</span>`).join('')||'<span class="mu">Всё уже есть.</span>'}</div>
  <h3>Дерево скрещивания</h3><p class="lg">${lg} Нажмите на вид в дереве, чтобы отметить, что он у вас уже есть (повторное нажатие снимает отметку).</p>
  <div class="tv"><div class="t"><ul>${node(cur,[],-1)}</ul></div></div>
  <h3>Порядок действий (${steps.length})</h3><ol>${steps.map(([x,a,b,c,cd])=>`<li>${role(0)[0]} ${tr(a)} + ${role(1)[0]} ${tr(b)} → <b>${tr(x)}</b>${pc(c)}${cd?` <span style="color:var(--wa)">⚑ ${cd}</span>`:''}</li>`).join('')}</ol>`
  :`<p class="mu">${REC[cur]?'У вас уже есть этот вид.':mode==='t'?'Это базовый вид: его не скрестить, а нужно найти в мире.':'У этой пчелы нет рецепта скрещивания: её находят в мире (ульи, подземелья) или добывают другим способом. Подробности смотрите в Apiarist Database.'}${cur==='Acacia'?' Акация растёт в саваннах.':''}</p>`);
}
function renderAll(){renderFilters();renderList();renderOut()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sp],[data-f],[data-alt],[data-tab],[data-own]');if(!t)return;
  const d=t.dataset;
  if(d.tab){setMode(d.tab);return}
  if(d.alt){ch[d.alt]=(ch[d.alt]||0)+1;renderOut();return}
  if(d.own){own.has(d.own)?own.delete(d.own):own.add(d.own);save();renderOut();return}
  if(d.sp)cur=d.sp;else if(d.f)flt=d.f;
  renderAll();
});
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('#q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const f=$('#list .chip');if(f){cur=f.dataset.sp;renderAll()}
});
setMode('t');
</script>
</body>
</html>
